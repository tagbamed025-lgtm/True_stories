<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plan 12 — 50 autorisations</title>
<style>
  html,body{margin:0;background:#020306;overflow:hidden}
  #wrap{position:relative;width:1920px;height:804px;background:#020306}
  canvas{display:block}
  #legende{position:absolute;left:0;right:0;bottom:56px;text-align:center;
    font:600 30px/1.2 "Inter",system-ui,sans-serif;letter-spacing:.18em;color:#e8eefc;opacity:0;
    text-transform:uppercase}
  #compteur{position:absolute;top:48px;left:0;right:0;text-align:center;
    font:500 22px/1 "JetBrains Mono",ui-monospace,monospace;color:#7fa3ff;letter-spacing:.12em}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.07;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>
<!-- TRU Stories · Binance · Plan 12 (8 s, 30 fps = 240 images).
     Capture image par image : ouvrir avec ?frame=N pour obtenir l'image N (0..239),
     ou sans paramètre pour la lecture en temps réel. -->
<div id="wrap">
  <div id="compteur">NONCE 18 914 775 → 18 914 824</div>
  <div id="legende">1 sur 50</div>
  <div id="grain"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=1920,H=804,FPS=30,TOTAL=240;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setPixelRatio(1);
document.getElementById('wrap').prepend(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x020306,0.035);
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,200);

// coffre (Binance 14) : bloc sombre au centre
const coffre=new THREE.Mesh(new THREE.BoxGeometry(3.2,3.2,1.2),
  new THREE.MeshStandardMaterial({color:0x101218,metalness:.7,roughness:.4}));
coffre.position.set(0,0,-4);scene.add(coffre);
const porteMat=new THREE.MeshStandardMaterial({color:0x111111,emissive:0x2a2f3a,emissiveIntensity:1});
const porte=new THREE.Mesh(new THREE.PlaneGeometry(2.6,2.6),porteMat);
porte.position.set(0,0,-3.39);scene.add(porte);
scene.add(new THREE.AmbientLight(0x223355,0.6));
const pl=new THREE.PointLight(0x5c8cff,2,30);pl.position.set(0,4,4);scene.add(pl);

// 50 cartes (autorisations)
const cartes=[];const geo=new THREE.PlaneGeometry(0.42,0.26);
const GAGNANTE=31;
for(let i=0;i<50;i++){
  const m=new THREE.MeshBasicMaterial({color:0x9fbaff,transparent:true,opacity:0});
  const c=new THREE.Mesh(geo,m);
  const ang=(i/50)*Math.PI*2, r=6+((i*37)%10)/4;
  c.userData={depart:new THREE.Vector3(Math.cos(ang)*r,Math.sin(ang)*r*0.45,6+(i%5)),
    delai:i*0.6, chute:new THREE.Vector3(Math.cos(ang)*1.8,-4-(i%4)*0.5,-3.2)};
  scene.add(c);cartes.push(c);
}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const legende=document.getElementById('legende');

function rendre(f){
  const t=f/FPS;
  // caméra : orbite lente
  const a=-0.25+t*0.04;
  cam.position.set(Math.sin(a)*14,1.2,Math.cos(a)*14);cam.lookAt(0,0,-2);
  cartes.forEach((c,i)=>{
    const u=c.userData;const tl=Math.max(0,(f-u.delai)/45); // 1,5 s de vol
    if(tl<=0){c.material.opacity=0;return;}
    const vol=Math.min(1,tl);
    const cible=new THREE.Vector3(((i%10)-4.5)*0.3,(Math.floor(i/10)-2)*0.3,-3.3);
    c.position.lerpVectors(u.depart,cible,ease(vol));
    c.lookAt(cam.position);
    c.material.opacity=Math.min(1,tl*3);
    if(vol>=1){
      if(i===GAGNANTE){
        // la seule qui "touche" : devient rouge, reste, grossit
        const k=Math.min(1,(f-(u.delai+45))/20);
        c.material.color.setHex(0xff2a1a);c.scale.setScalar(1+k*1.6);
        c.position.set(0,0,-3.25);
      }else{
        // les 49 autres s'éteignent et tombent
        const k=Math.min(1,(f-(u.delai+45))/30);
        c.position.lerpVectors(cible,u.chute,ease(Math.max(0,k)));
        c.material.opacity=Math.max(0,1-k*1.2);
      }
    }
  });
  // après toutes les cartes : la porte du coffre s'éclaire en rouge
  const fin=Math.min(1,Math.max(0,(f-150)/40));
  porteMat.emissive.setRGB(0.16+fin*0.84,0.18-fin*0.15,0.23-fin*0.2);
  porteMat.emissiveIntensity=1+fin*2.5;
  legende.style.opacity=fin;
  renderer.render(scene,cam);
}
const q=new URLSearchParams(location.search);
if(q.has('frame')){rendre(+q.get('frame'));window.FRAME_PRET=true;}
else{let f=0;(function boucle(){rendre(f);f=(f+1)%TOTAL;requestAnimationFrame(boucle);})();}
</script>
</body>
</html>
