<!doctype html>
<!-- TRU Stories · carte chiffre lisible sur téléphone : UN chiffre énorme au centre, une étiquette dessous, rien qui le traverse.
     carte.html?t=<s>&n=<nombre>&u=<unité après le nombre>&l=<étiquette>&h=<petit en-tête>&c=rouge|blanc|or&cnt=<valeur de départ pour compter> -->
<html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:"TRU Texte";src:local("Segoe UI"),url(polices/OpenSans.ttf)}
@font-face{font-family:"TRU Titre";src:local("Georgia Bold Italic"),url(polices/GelasioBoldItalic.ttf)}
html,body{margin:0;width:1920px;height:804px;background:#040506;overflow:hidden;color:#eef2f6;font-family:"TRU Texte",sans-serif}
#w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#h{font-size:34px;letter-spacing:.32em;text-transform:uppercase;color:#8c96a2}
#n{font:300 230px/1 "TRU Texte",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
#n small{font-size:110px;margin-left:24px;font-weight:300}
#l{font-size:58px;font-weight:300;color:#cfd6de;max-width:1600px;text-align:center}
#lu{position:absolute;inset:0;background:radial-gradient(ellipse at center,var(--g),transparent 62%)}
</style></head><body><div id="lu"></div><div id="w"><div id="h"></div><div id="n"></div><div id="l"></div></div><script>
const q=new URLSearchParams(location.search),t=+(q.get('t')||0),cl=x=>Math.max(0,Math.min(1,x)),E=u=>u*u*(3-2*u),P=(a,b)=>E(cl((t-a)/(b-a)));
const C={rouge:'#ff3b30',blanc:'#eef2f6',or:'#f0b90b'}[q.get('c')||'blanc'];document.documentElement.style.setProperty('--g',(q.get('c')==='rouge'?'rgba(255,40,30,.13)':q.get('c')==='or'?'rgba(240,185,11,.12)':'rgba(200,215,235,.06)'));
const N=q.get('n')||'',U=q.get('u')||'';let txt=N;
if(q.get('cnt')!==null){const fin=parseFloat(N.replace(/\s/g,'').replace(',','.')),dep=parseFloat(q.get('cnt')),v=dep+(fin-dep)*P(0,1.4),dec=(N.split(',')[1]||'').length;
  txt=v.toFixed(dec).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
const n=document.getElementById('n');n.innerHTML=txt+(U?`<small>${U}</small>`:'');n.style.color=C;
document.getElementById('h').textContent=q.get('h')||'';document.getElementById('l').textContent=q.get('l')||'';
document.getElementById('w').style.opacity=P(0,.35);document.getElementById('w').style.transform=`scale(${.96+.06*P(0,4)})`;
document.getElementById('l').style.opacity=P(.5,1);window.FRAME_PRET=true</script></body></html>
